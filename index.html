<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a120a" />
<title>SERPENT</title>
<style>
  :root {
    --bg: #050a06;
    --panel: #0a120a;
    --grid: #0f1d10;
    --dim: #14401a;
    --fg: #7fff9c;
    --hot: #c8ffd3;
    --warn: #ffd86b;
    --bad: #ff5a5a;
    --glow: 0 0 6px rgba(127,255,156,0.55), 0 0 18px rgba(127,255,156,0.25);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "VT323", "Courier New", ui-monospace, monospace;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(ellipse at center, #0b1a0d 0%, #04070a 60%, #02040a 100%);
  }

  .stage {
    width: min(96vmin, 560px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: "VT323", "Courier New", monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-shadow: var(--glow);
    font-size: clamp(14px, 3.6vmin, 22px);
  }
  .hud .label { color: var(--dim); font-size: 0.7em; }
  .hud .val { color: var(--hot); }
  .hud .title {
    flex: 1;
    text-align: center;
    color: var(--fg);
    font-size: 1.1em;
    letter-spacing: 0.4em;
  }

  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    background: var(--panel);
    box-shadow:
      inset 0 0 0 2px #1c3a20,
      inset 0 0 60px rgba(0,0,0,0.7),
      0 0 0 1px #000,
      0 8px 30px rgba(0,0,0,0.6),
      0 0 60px rgba(60,200,90,0.08);
    overflow: hidden;
  }

  canvas#game {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  .scan {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.16) 0px,
        rgba(0,0,0,0.16) 1px,
        transparent 1px,
        transparent 3px
      );
    mix-blend-mode: multiply;
    opacity: 0.55;
  }
  .vignette {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  .flicker {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: rgba(127,255,156,0.02);
    animation: flicker 5s infinite;
  }
  @keyframes flicker {
    0%,100% { opacity: 0.0; }
    47% { opacity: 0.0; }
    48% { opacity: 0.6; }
    49% { opacity: 0.0; }
    72% { opacity: 0.0; }
    73% { opacity: 0.4; }
    74% { opacity: 0.0; }
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 18px;
    background: radial-gradient(ellipse at center, rgba(5,12,7,0.55) 0%, rgba(2,5,3,0.85) 100%);
    color: var(--fg);
    text-shadow: var(--glow);
    font-size: clamp(14px, 3.6vmin, 22px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: opacity 200ms ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 {
    margin: 0;
    font-size: clamp(28px, 9vmin, 64px);
    letter-spacing: 0.5em;
    color: var(--hot);
    text-shadow: 0 0 8px rgba(200,255,211,0.85), 0 0 24px rgba(127,255,156,0.5);
  }
  .overlay h2 {
    margin: 0;
    font-size: clamp(20px, 6vmin, 40px);
    letter-spacing: 0.4em;
    color: var(--warn);
    text-shadow: 0 0 6px rgba(255,216,107,0.7), 0 0 18px rgba(255,216,107,0.35);
  }
  .overlay p { margin: 0; opacity: 0.85; }
  .overlay .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  .pad {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    aspect-ratio: 3 / 2;
    max-height: 36vh;
  }
  .pad button {
    appearance: none;
    border: 2px solid #1c3a20;
    background:
      linear-gradient(180deg, #0d1a10, #0a120a);
    color: var(--fg);
    border-radius: 10px;
    font-family: inherit;
    font-size: clamp(20px, 6vmin, 36px);
    text-shadow: var(--glow);
    cursor: pointer;
    box-shadow:
      inset 0 0 0 1px #000,
      inset 0 -4px 0 rgba(0,0,0,0.4),
      0 0 12px rgba(60,200,90,0.05);
    transition: transform 60ms ease, box-shadow 60ms ease, background 60ms ease;
    touch-action: manipulation;
  }
  .pad button:active,
  .pad button.active {
    transform: translateY(1px);
    background: linear-gradient(180deg, #16361b, #0d1f10);
    box-shadow:
      inset 0 0 0 1px #000,
      inset 0 0 12px rgba(127,255,156,0.25);
  }
  .pad .empty { visibility: hidden; }
  .pad .center {
    color: var(--warn);
    border-color: #3a3a18;
    text-shadow: 0 0 6px rgba(255,216,107,0.7);
  }

  .footer {
    text-align: center;
    color: var(--dim);
    font-size: clamp(11px, 2.6vmin, 14px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }
  .footer kbd {
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--dim);
    border-radius: 4px;
    padding: 0 6px;
    font: inherit;
  }

  @media (hover: hover) and (pointer: fine) {
    .pad { display: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="hud">
      <div><span class="label">Score</span> <span class="val" id="score">0</span></div>
      <div class="title">Serpent</div>
      <div><span class="label">Best</span> <span class="val" id="best">0</span></div>
    </div>

    <div class="frame" id="frame">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="scan"></div>
      <div class="vignette"></div>
      <div class="flicker"></div>

      <div class="overlay" id="overlay">
        <h1>Serpent</h1>
        <p>Eat. Grow. Survive.</p>
        <p class="blink">Tap or press any key</p>
      </div>
    </div>

    <div class="pad" id="pad" aria-hidden="true">
      <span class="empty"></span>
      <button data-dir="up" aria-label="Up">▲</button>
      <span class="empty"></span>
      <button data-dir="left" aria-label="Left">◀</button>
      <button class="center" data-dir="pause" aria-label="Pause">II</button>
      <button data-dir="right" aria-label="Right">▶</button>
      <span class="empty"></span>
      <button data-dir="down" aria-label="Down">▼</button>
      <span class="empty"></span>
    </div>

    <div class="footer">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>WASD</kbd> · <kbd>Space</kbd> pause · <kbd>R</kbd> restart
    </div>
  </div>

<script>
(() => {
  "use strict";

  const COLS = 24;
  const ROWS = 24;
  const BASE_STEP_MS = 150;
  const MIN_STEP_MS = 55;
  const SPEEDUP_PER_FOOD = 0.965;
  const STORAGE_KEY = "serpent.best.v1";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const pad = document.getElementById("pad");
  const frame = document.getElementById("frame");

  let cell, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const size = Math.floor(Math.min(rect.width, rect.height));
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    cell = (size * dpr) / COLS;
  }
  window.addEventListener("resize", resize);

  const State = { MENU: "menu", PLAYING: "playing", PAUSED: "paused", DEAD: "dead" };
  let state = State.MENU;

  let snake, dir, queuedDirs, food, score, best, stepMs, lastStep, prevHead, lastTick, deathFlash;

  function reset() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [
      { x: cx - 1, y: cy },
      { x: cx, y: cy },
      { x: cx + 1, y: cy },
    ];
    dir = { x: 1, y: 0 };
    queuedDirs = [];
    score = 0;
    stepMs = BASE_STEP_MS;
    lastStep = 0;
    prevHead = { x: snake[snake.length - 1].x, y: snake[snake.length - 1].y };
    deathFlash = 0;
    placeFood();
    updateHud();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + "," + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!occupied.has(x + "," + y)) free.push({ x, y });
    if (free.length === 0) { food = null; return; }
    food = free[(Math.random() * free.length) | 0];
  }

  function loadBest() {
    try {
      const v = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
      best = isFinite(v) ? v : 0;
    } catch { best = 0; }
    bestEl.textContent = best;
  }
  function saveBest() {
    try { localStorage.setItem(STORAGE_KEY, String(best)); } catch {}
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function setOverlay(html, visible = true) {
    if (!visible) {
      overlay.classList.add("hidden");
      return;
    }
    overlay.innerHTML = html;
    overlay.classList.remove("hidden");
  }

  function showMenu() {
    state = State.MENU;
    setOverlay(`
      <h1>Serpent</h1>
      <p>Eat. Grow. Survive.</p>
      <p class="blink">Tap or press any key</p>
    `);
  }

  function showPaused() {
    state = State.PAUSED;
    setOverlay(`
      <h2>Paused</h2>
      <p class="blink">Resume — tap or space</p>
    `);
  }

  function showGameOver() {
    state = State.DEAD;
    const newBest = score >= best && score > 0;
    if (newBest) { best = score; saveBest(); updateHud(); }
    setOverlay(`
      <h2>Game Over</h2>
      <p>Score <span style="color:var(--hot)">${score}</span> · Best <span style="color:var(--hot)">${best}</span></p>
      ${newBest ? `<p style="color:var(--hot)">New record</p>` : ""}
      <p class="blink">Tap or press R to retry</p>
    `);
  }

  function start() {
    reset();
    state = State.PLAYING;
    setOverlay("", false);
    lastTick = performance.now();
    requestAnimationFrame(loop);
  }

  function tryQueueDir(nx, ny) {
    const lastDir = queuedDirs.length ? queuedDirs[queuedDirs.length - 1] : dir;
    if (lastDir.x === nx && lastDir.y === ny) return;
    if (lastDir.x === -nx && lastDir.y === -ny) return;
    queuedDirs.push({ x: nx, y: ny });
    if (queuedDirs.length > 3) queuedDirs.shift();
  }

  function step() {
    if (queuedDirs.length) dir = queuedDirs.shift();
    const head = snake[snake.length - 1];
    prevHead = { x: head.x, y: head.y };
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      die();
      return;
    }
    for (let i = 1; i < snake.length; i++) {
      if (snake[i].x === nx && snake[i].y === ny) {
        die();
        return;
      }
    }

    const ate = food && nx === food.x && ny === food.y;
    snake.push({ x: nx, y: ny });
    if (ate) {
      score += 1;
      stepMs = Math.max(MIN_STEP_MS, stepMs * SPEEDUP_PER_FOOD);
      placeFood();
      updateHud();
      blip(880, 0.04);
    } else {
      snake.shift();
    }
  }

  function die() {
    deathFlash = 1;
    blip(120, 0.18, "sawtooth");
    setTimeout(showGameOver, 260);
    state = State.DEAD;
  }

  // Audio — tiny WebAudio blip, lazy-init on first interaction.
  let actx;
  function blip(freq, dur = 0.05, type = "square") {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = 0.0001;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    } catch {}
  }

  function loop(now) {
    const dt = now - lastTick;
    lastTick = now;
    if (state === State.PLAYING) {
      lastStep += dt;
      while (lastStep >= stepMs) {
        lastStep -= stepMs;
        step();
        if (state !== State.PLAYING) break;
      }
    } else {
      lastStep = 0;
    }
    draw(state === State.PLAYING ? Math.min(1, lastStep / stepMs) : 0);
    if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - dt / 260);
    requestAnimationFrame(loop);
  }

  function draw(t) {
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = "#06100a";
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = "rgba(60,140,80,0.07)";
    ctx.lineWidth = Math.max(1, dpr * 0.5);
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      ctx.moveTo(i * cell, 0);
      ctx.lineTo(i * cell, H);
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.moveTo(0, i * cell);
      ctx.lineTo(W, i * cell);
    }
    ctx.stroke();

    // Border ticks
    ctx.fillStyle = "rgba(60,140,80,0.18)";
    const tick = cell * 0.16;
    for (let i = 0; i < COLS; i++) {
      ctx.fillRect(i * cell + cell * 0.5 - tick * 0.5, 0, tick, dpr * 1.5);
      ctx.fillRect(i * cell + cell * 0.5 - tick * 0.5, H - dpr * 1.5, tick, dpr * 1.5);
      ctx.fillRect(0, i * cell + cell * 0.5 - tick * 0.5, dpr * 1.5, tick);
      ctx.fillRect(W - dpr * 1.5, i * cell + cell * 0.5 - tick * 0.5, dpr * 1.5, tick);
    }

    // Food
    if (food) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 220);
      const fx = food.x * cell + cell * 0.5;
      const fy = food.y * cell + cell * 0.5;
      const r = cell * (0.32 + 0.06 * pulse);
      ctx.shadowColor = "rgba(255,216,107,0.85)";
      ctx.shadowBlur = cell * 0.6;
      ctx.fillStyle = "#ffd86b";
      ctx.beginPath();
      ctx.arc(fx, fy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fff7d6";
      ctx.beginPath();
      ctx.arc(fx - r * 0.3, fy - r * 0.3, r * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Snake — interpolate head between prev and current cell when running
    const n = snake.length;
    for (let i = 0; i < n; i++) {
      const seg = snake[i];
      let sx = seg.x, sy = seg.y;
      if (i === n - 1 && state === State.PLAYING && t > 0 && t < 1) {
        sx = prevHead.x + (seg.x - prevHead.x) * t;
        sy = prevHead.y + (seg.y - prevHead.y) * t;
      }
      const x = sx * cell;
      const y = sy * cell;
      const isHead = i === n - 1;
      const tail01 = i / Math.max(1, n - 1);
      const lightness = 50 + tail01 * 25;
      ctx.fillStyle = isHead ? "#c8ffd3" : `hsl(135 70% ${lightness}%)`;
      if (isHead) {
        ctx.shadowColor = "rgba(127,255,156,0.7)";
        ctx.shadowBlur = cell * 0.7;
      }
      const inset = cell * 0.10;
      const r = cell * 0.18;
      roundRect(ctx, x + inset, y + inset, cell - inset * 2, cell - inset * 2, r);
      ctx.fill();
      if (isHead) ctx.shadowBlur = 0;

      // Eyes on head
      if (isHead) {
        ctx.fillStyle = "#0a120a";
        const ex = cell * 0.22, ey = cell * 0.22;
        let dx1, dy1, dx2, dy2;
        if (dir.x === 1)  { dx1 = cell - ex - cell*0.18; dy1 = ey;        dx2 = cell - ex - cell*0.18; dy2 = cell - ey - cell*0.18; }
        else if (dir.x === -1) { dx1 = cell*0.18; dy1 = ey;        dx2 = cell*0.18; dy2 = cell - ey - cell*0.18; }
        else if (dir.y === -1) { dx1 = ex;        dy1 = cell*0.18; dx2 = cell - ex - cell*0.18; dy2 = cell*0.18; }
        else                   { dx1 = ex;        dy1 = cell - ey - cell*0.18; dx2 = cell - ex - cell*0.18; dy2 = cell - ey - cell*0.18; }
        const er = cell * 0.07;
        ctx.beginPath(); ctx.arc(x + dx1, y + dy1, er, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + dx2, y + dy2, er, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (deathFlash > 0) {
      ctx.fillStyle = `rgba(255,90,90,${0.35 * deathFlash})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  // Input
  function onKey(e) {
    const k = e.key;
    if (state === State.MENU || state === State.DEAD) {
      if (k === "r" || k === "R" || k === " " || k === "Enter" ||
          k.startsWith("Arrow") || /^[wasd]$/i.test(k)) {
        e.preventDefault();
        start();
        return;
      }
    }
    if (state === State.PAUSED) {
      if (k === " " || k === "Escape" || k === "p" || k === "P") {
        e.preventDefault();
        state = State.PLAYING;
        setOverlay("", false);
        return;
      }
    }
    if (state === State.PLAYING) {
      if (k === " " || k === "Escape" || k === "p" || k === "P") {
        e.preventDefault();
        showPaused();
        return;
      }
      if (k === "r" || k === "R") { e.preventDefault(); start(); return; }
      if (k === "ArrowUp"    || k === "w" || k === "W") { e.preventDefault(); tryQueueDir(0, -1); }
      if (k === "ArrowDown"  || k === "s" || k === "S") { e.preventDefault(); tryQueueDir(0,  1); }
      if (k === "ArrowLeft"  || k === "a" || k === "A") { e.preventDefault(); tryQueueDir(-1, 0); }
      if (k === "ArrowRight" || k === "d" || k === "D") { e.preventDefault(); tryQueueDir(1,  0); }
    }
  }
  window.addEventListener("keydown", onKey, { passive: false });

  pad.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const d = btn.dataset.dir;
    handleDirInput(d);
  });

  function handleDirInput(d) {
    if (d === "pause") {
      if (state === State.PLAYING) showPaused();
      else if (state === State.PAUSED) { state = State.PLAYING; setOverlay("", false); }
      else if (state === State.MENU || state === State.DEAD) start();
      return;
    }
    if (state === State.MENU || state === State.DEAD) { start(); }
    if (state !== State.PLAYING) return;
    if (d === "up")    tryQueueDir(0, -1);
    if (d === "down")  tryQueueDir(0,  1);
    if (d === "left")  tryQueueDir(-1, 0);
    if (d === "right") tryQueueDir(1,  0);
  }

  // Touch / swipe on the canvas frame.
  let touchStart = null;
  const SWIPE_MIN = 18;
  frame.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY, time: performance.now(), moved: false };
  }, { passive: true });
  frame.addEventListener("touchmove", (e) => {
    if (!touchStart || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < SWIPE_MIN && ay < SWIPE_MIN) return;
    if (ax > ay) handleDirInput(dx > 0 ? "right" : "left");
    else         handleDirInput(dy > 0 ? "down"  : "up");
    touchStart.moved = true;
    touchStart.x = t.clientX;
    touchStart.y = t.clientY;
  }, { passive: true });
  frame.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const elapsed = performance.now() - touchStart.time;
    if (!touchStart.moved && elapsed < 350) {
      // Tap: start from menu/dead, pause/resume during play.
      if (state === State.MENU || state === State.DEAD) start();
      else if (state === State.PLAYING) showPaused();
      else if (state === State.PAUSED) { state = State.PLAYING; setOverlay("", false); }
    }
    touchStart = null;
  });

  // Click on overlay also starts/resumes (desktop convenience).
  overlay.addEventListener("click", () => {
    if (state === State.MENU || state === State.DEAD) start();
    else if (state === State.PAUSED) { state = State.PLAYING; setOverlay("", false); }
  });

  // Pause when the tab is hidden.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === State.PLAYING) showPaused();
  });

  // Boot
  loadBest();
  resize();
  // Need an initial frame loop so the canvas isn't blank behind the overlay.
  reset();
  lastTick = performance.now();
  requestAnimationFrame(function boot(now) {
    lastTick = now;
    requestAnimationFrame(loop);
  });
  showMenu();
})();
</script>
</body>
</html>
