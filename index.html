<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#b9e4ff" />
<title>SERPENT</title>
<style>
  :root {
    --bg-1: #fff3c4;        /* warm cream */
    --bg-2: #b9e4ff;        /* sky blue */
    --panel: #ffffff;
    --grid: #e7f3d8;
    --ink: #2c3e50;
    --soft: #6b8aa3;
    --leaf: #43a047;
    --leaf-2: #7cc36a;
    --leaf-light: #c5e1a5;
    --apple: #ef5350;
    --apple-deep: #c62828;
    --sun: #ffb300;
    --grape: #7e57c2;
    --sky: #4fc3f7;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    color: var(--ink);
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Trebuchet MS", system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(circle at 20% 15%, #fff7d6 0%, transparent 55%),
      radial-gradient(circle at 80% 90%, #d6f0ff 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-2) 0%, #cfeaff 35%, #fff3c4 100%);
  }

  .stage {
    width: min(96vmin, 560px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-size: clamp(14px, 3.4vmin, 22px);
  }
  .hud .pill {
    background: rgba(255,255,255,0.85);
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 6px 14px;
    box-shadow: 0 4px 0 rgba(60,90,120,0.12), 0 1px 0 #fff inset;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--ink);
  }
  .hud .pill .label { color: var(--soft); font-size: 0.8em; }
  .hud .pill .val { color: var(--leaf); font-weight: 800; }
  .hud .pill.best .val { color: var(--grape); }
  .hud .pill.speed .val { color: var(--sun); }
  .hud .title {
    flex: 1;
    text-align: center;
    color: var(--grape);
    font-size: 1.4em;
    letter-spacing: 0.18em;
    text-shadow:
      2px 2px 0 #fff,
      4px 4px 0 rgba(126,87,194,0.18);
    font-weight: 800;
  }

  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    background: var(--panel);
    border: 6px solid #ffffff;
    box-shadow:
      0 12px 0 rgba(60,90,120,0.10),
      0 22px 50px rgba(60,90,120,0.18),
      inset 0 0 0 2px rgba(126,195,106,0.25);
    overflow: hidden;
  }

  canvas#game {
    width: 100%;
    height: 100%;
    display: block;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.78) 60%, rgba(255,255,255,0.7) 100%);
    color: var(--ink);
    font-size: clamp(14px, 3.4vmin, 22px);
    letter-spacing: 0.04em;
    transition: opacity 200ms ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 {
    margin: 0;
    font-size: clamp(34px, 11vmin, 78px);
    letter-spacing: 0.18em;
    color: var(--grape);
    text-shadow:
      3px 3px 0 #fff,
      6px 6px 0 rgba(126,87,194,0.22);
    font-weight: 800;
  }
  .overlay h2 {
    margin: 0;
    font-size: clamp(24px, 7vmin, 44px);
    letter-spacing: 0.1em;
    color: var(--apple-deep);
    text-shadow: 2px 2px 0 #fff;
    font-weight: 800;
  }
  .overlay p { margin: 0; color: var(--ink); }
  .overlay .hint { color: var(--soft); }
  .overlay .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  .speeds {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 6px;
  }
  .speeds button {
    appearance: none;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 800;
    font-size: clamp(14px, 3.4vmin, 20px);
    color: var(--ink);
    background: #ffffff;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(60,90,120,0.18);
    transition: transform 80ms ease, background 80ms ease, color 80ms ease, box-shadow 80ms ease;
  }
  .speeds button:hover { transform: translateY(-1px); }
  .speeds button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(60,90,120,0.18); }
  .speeds button.on {
    background: linear-gradient(180deg, #ffd76b, var(--sun));
    color: #fff;
    box-shadow:
      0 4px 0 rgba(184,120,0,0.35),
      0 0 0 3px rgba(255,179,0,0.25);
  }
  .speeds .num {
    display: inline-block;
    background: rgba(0,0,0,0.08);
    color: var(--soft);
    border-radius: 6px;
    padding: 0 6px;
    margin-right: 6px;
    font-size: 0.8em;
  }
  .speeds button.on .num { background: rgba(255,255,255,0.35); color: #fff; }

  .pad {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    aspect-ratio: 3 / 2;
    max-height: 36vh;
  }
  .pad button {
    appearance: none;
    border: 4px solid #ffffff;
    background: linear-gradient(180deg, #ffffff, #eaf6ff);
    color: var(--sky);
    border-radius: 18px;
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(22px, 6.4vmin, 38px);
    cursor: pointer;
    box-shadow:
      0 6px 0 rgba(60,120,160,0.22),
      0 1px 0 rgba(255,255,255,0.9) inset;
    transition: transform 60ms ease, box-shadow 60ms ease, background 60ms ease;
    touch-action: manipulation;
  }
  .pad button:active,
  .pad button.active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 rgba(60,120,160,0.22);
    background: linear-gradient(180deg, #d8efff, #bfe4ff);
  }
  .pad .empty { visibility: hidden; }
  .pad .center {
    color: var(--sun);
    background: linear-gradient(180deg, #fff7d6, #ffe79c);
    box-shadow: 0 6px 0 rgba(180,130,0,0.25);
    font-size: clamp(18px, 5vmin, 28px);
  }
  .pad .center:active {
    background: linear-gradient(180deg, #ffe79c, #ffd76b);
    box-shadow: 0 3px 0 rgba(180,130,0,0.25);
  }

  .footer {
    text-align: center;
    color: var(--soft);
    font-size: clamp(11px, 2.6vmin, 14px);
    letter-spacing: 0.04em;
  }
  .footer kbd {
    color: var(--ink);
    background: #ffffffcc;
    border: 1px solid #ffffff;
    border-radius: 6px;
    padding: 1px 7px;
    font-family: inherit;
    font-weight: 700;
    box-shadow: 0 2px 0 rgba(60,90,120,0.12);
  }

  @media (hover: hover) and (pointer: fine) {
    .pad { display: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="hud">
      <div class="pill"><span class="label">Score</span> <span class="val" id="score">0</span></div>
      <div class="title">SERPENT</div>
      <div class="pill best"><span class="label">Best</span> <span class="val" id="best">0</span></div>
    </div>
    <div class="hud" style="justify-content:center;">
      <div class="pill speed"><span class="label">Speed</span> <span class="val" id="speed">Normal</span></div>
    </div>

    <div class="frame" id="frame">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>

    <div class="pad" id="pad" aria-hidden="true">
      <span class="empty"></span>
      <button data-dir="up" aria-label="Up">▲</button>
      <span class="empty"></span>
      <button data-dir="left" aria-label="Left">◀</button>
      <button class="center" data-dir="pause" aria-label="Pause">PAUSE</button>
      <button data-dir="right" aria-label="Right">▶</button>
      <span class="empty"></span>
      <button data-dir="down" aria-label="Down">▼</button>
      <span class="empty"></span>
    </div>

    <div class="footer">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>WASD</kbd> to steer · <kbd>Space</kbd> pause · <kbd>R</kbd> restart · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> change speed
    </div>
  </div>

<script>
(() => {
  "use strict";

  const COLS = 24;
  const ROWS = 24;
  const MIN_STEP_MS = 50;
  const SPEEDUP_PER_FOOD = 0.97;
  const STORAGE_KEY = "serpent.best.v1";
  const SPEED_KEY = "serpent.speed.v1";

  const SPEED_PRESETS = {
    slow:   { label: "Slow",   stepMs: 220 },
    normal: { label: "Normal", stepMs: 150 },
    fast:   { label: "Fast",   stepMs: 90  },
  };
  const SPEED_ORDER = ["slow", "normal", "fast"];
  let speedKey = "normal";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const speedHudEl = document.getElementById("speed");
  const overlay = document.getElementById("overlay");
  const pad = document.getElementById("pad");
  const frame = document.getElementById("frame");

  let cell, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const size = Math.floor(Math.min(rect.width, rect.height));
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    cell = (size * dpr) / COLS;
  }
  window.addEventListener("resize", resize);

  const State = { MENU: "menu", PLAYING: "playing", PAUSED: "paused", DEAD: "dead" };
  let state = State.MENU;

  let snake, dir, queuedDirs, food, score, best, stepMs, lastStep, prevHead, lastTick, deathFlash;

  function reset() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [
      { x: cx - 1, y: cy },
      { x: cx, y: cy },
      { x: cx + 1, y: cy },
    ];
    dir = { x: 1, y: 0 };
    queuedDirs = [];
    score = 0;
    stepMs = SPEED_PRESETS[speedKey].stepMs;
    lastStep = 0;
    prevHead = { x: snake[snake.length - 1].x, y: snake[snake.length - 1].y };
    deathFlash = 0;
    placeFood();
    updateHud();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + "," + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!occupied.has(x + "," + y)) free.push({ x, y });
    if (free.length === 0) { food = null; return; }
    food = free[(Math.random() * free.length) | 0];
  }

  function loadBest() {
    try {
      const v = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
      best = isFinite(v) ? v : 0;
    } catch { best = 0; }
  }
  function saveBest() {
    try { localStorage.setItem(STORAGE_KEY, String(best)); } catch {}
  }
  function loadSpeed() {
    try {
      const v = localStorage.getItem(SPEED_KEY);
      if (v && SPEED_PRESETS[v]) speedKey = v;
    } catch {}
  }
  function saveSpeed() {
    try { localStorage.setItem(SPEED_KEY, speedKey); } catch {}
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    speedHudEl.textContent = SPEED_PRESETS[speedKey].label;
  }

  function setSpeed(k) {
    if (!SPEED_PRESETS[k]) return;
    speedKey = k;
    saveSpeed();
    if (state === State.PLAYING) {
      // Apply new base, preserving the eaten-food ramp.
      stepMs = Math.max(MIN_STEP_MS, SPEED_PRESETS[speedKey].stepMs * Math.pow(SPEEDUP_PER_FOOD, score));
    }
    updateHud();
    // Re-render the current overlay so the active button highlights move.
    if (state === State.MENU) showMenu();
    else if (state === State.PAUSED) showPaused();
    else if (state === State.DEAD) showGameOver(true);
  }

  function speedButtonsHTML() {
    return `<div class="speeds">${
      SPEED_ORDER.map((k, i) => `
        <button data-speed="${k}" class="${k===speedKey?'on':''}">
          <span class="num">${i+1}</span>${SPEED_PRESETS[k].label}
        </button>
      `).join("")
    }</div>`;
  }

  function setOverlay(html, visible = true) {
    if (!visible) {
      overlay.classList.add("hidden");
      return;
    }
    overlay.innerHTML = html;
    overlay.classList.remove("hidden");
  }

  function showMenu() {
    state = State.MENU;
    setOverlay(`
      <h1>Serpent</h1>
      <p>Eat apples. Grow. Have fun!</p>
      ${speedButtonsHTML()}
      <p class="hint blink">Tap or press any arrow to start</p>
    `);
  }

  function showPaused() {
    state = State.PAUSED;
    setOverlay(`
      <h2>Paused</h2>
      ${speedButtonsHTML()}
      <p class="hint blink">Tap or press space to resume</p>
    `);
  }

  let lastDeathWasRecord = false;
  function showGameOver(rerender = false) {
    state = State.DEAD;
    if (!rerender) {
      lastDeathWasRecord = score > 0 && score >= best;
      if (lastDeathWasRecord) { best = score; saveBest(); updateHud(); }
    }
    setOverlay(`
      <h2>Game Over</h2>
      <p>Score <b style="color:var(--leaf)">${score}</b> · Best <b style="color:var(--grape)">${best}</b></p>
      ${lastDeathWasRecord ? `<p style="color:var(--apple-deep);font-weight:800">New record!</p>` : ""}
      ${speedButtonsHTML()}
      <p class="hint blink">Tap or press R to play again</p>
    `);
  }

  function start() {
    reset();
    state = State.PLAYING;
    setOverlay("", false);
    lastTick = performance.now();
  }

  function tryQueueDir(nx, ny) {
    const lastDir = queuedDirs.length ? queuedDirs[queuedDirs.length - 1] : dir;
    if (lastDir.x === nx && lastDir.y === ny) return;
    if (lastDir.x === -nx && lastDir.y === -ny) return;
    queuedDirs.push({ x: nx, y: ny });
    if (queuedDirs.length > 3) queuedDirs.shift();
  }

  function step() {
    if (queuedDirs.length) dir = queuedDirs.shift();
    const head = snake[snake.length - 1];
    prevHead = { x: head.x, y: head.y };
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      die();
      return;
    }
    for (let i = 1; i < snake.length; i++) {
      if (snake[i].x === nx && snake[i].y === ny) {
        die();
        return;
      }
    }

    const ate = food && nx === food.x && ny === food.y;
    snake.push({ x: nx, y: ny });
    if (ate) {
      score += 1;
      stepMs = Math.max(MIN_STEP_MS, stepMs * SPEEDUP_PER_FOOD);
      placeFood();
      updateHud();
      blip(880, 0.05);
    } else {
      snake.shift();
    }
  }

  function die() {
    deathFlash = 1;
    blip(180, 0.22, "sawtooth");
    state = State.DEAD;
    setTimeout(() => showGameOver(false), 280);
  }

  let actx;
  function blip(freq, dur = 0.05, type = "sine") {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = 0.0001;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    } catch {}
  }

  function loop(now) {
    const dt = now - lastTick;
    lastTick = now;
    if (state === State.PLAYING) {
      lastStep += dt;
      while (lastStep >= stepMs) {
        lastStep -= stepMs;
        step();
        if (state !== State.PLAYING) break;
      }
    } else {
      lastStep = 0;
    }
    draw(state === State.PLAYING ? Math.min(1, lastStep / stepMs) : 0);
    if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - dt / 280);
    requestAnimationFrame(loop);
  }

  function draw(t) {
    const W = canvas.width, H = canvas.height;

    // Soft sky gradient on the playfield itself
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#f7fff0");
    bg.addColorStop(1, "#eaf7ff");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Soft checker so the grid reads but stays gentle
    const tile = cell;
    ctx.fillStyle = "rgba(124,195,106,0.10)";
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (((x + y) & 1) === 0) ctx.fillRect(x * tile, y * tile, tile, tile);
      }
    }

    // Faint grid lines
    ctx.strokeStyle = "rgba(124,195,106,0.16)";
    ctx.lineWidth = Math.max(1, dpr * 0.5);
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      ctx.moveTo(i * cell, 0);
      ctx.lineTo(i * cell, H);
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.moveTo(0, i * cell);
      ctx.lineTo(W, i * cell);
    }
    ctx.stroke();

    // Apple (food)
    if (food) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 240);
      const fx = food.x * cell + cell * 0.5;
      const fy = food.y * cell + cell * 0.5;
      const r = cell * (0.34 + 0.05 * pulse);
      // body
      const grad = ctx.createRadialGradient(fx - r * 0.35, fy - r * 0.4, r * 0.1, fx, fy, r);
      grad.addColorStop(0, "#ff8a80");
      grad.addColorStop(0.6, "#ef5350");
      grad.addColorStop(1, "#c62828");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(fx, fy, r, 0, Math.PI * 2);
      ctx.fill();
      // shine
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.beginPath();
      ctx.ellipse(fx - r * 0.35, fy - r * 0.45, r * 0.22, r * 0.12, -0.6, 0, Math.PI * 2);
      ctx.fill();
      // leaf
      ctx.fillStyle = "#7cc36a";
      ctx.beginPath();
      ctx.ellipse(fx + r * 0.05, fy - r * 0.95, r * 0.28, r * 0.14, -0.6, 0, Math.PI * 2);
      ctx.fill();
      // stem
      ctx.strokeStyle = "#6d4c41";
      ctx.lineWidth = Math.max(1.5, dpr * 1.5);
      ctx.beginPath();
      ctx.moveTo(fx, fy - r * 0.85);
      ctx.lineTo(fx - r * 0.05, fy - r * 1.1);
      ctx.stroke();
    }

    // Snake
    const n = snake.length;
    for (let i = 0; i < n; i++) {
      const seg = snake[i];
      let sx = seg.x, sy = seg.y;
      if (i === n - 1 && state === State.PLAYING && t > 0 && t < 1) {
        sx = prevHead.x + (seg.x - prevHead.x) * t;
        sy = prevHead.y + (seg.y - prevHead.y) * t;
      }
      const x = sx * cell;
      const y = sy * cell;
      const isHead = i === n - 1;

      // body color: bright lime, slightly lighter toward the tail
      const tail01 = i / Math.max(1, n - 1);
      const lightness = 48 + tail01 * 18;
      ctx.fillStyle = isHead ? "#43a047" : `hsl(105 55% ${lightness}%)`;

      const inset = cell * 0.08;
      const r = cell * 0.30;
      roundRect(ctx, x + inset, y + inset, cell - inset * 2, cell - inset * 2, r);
      ctx.fill();

      // body highlight
      if (!isHead) {
        ctx.fillStyle = "rgba(255,255,255,0.30)";
        roundRect(ctx, x + inset, y + inset, cell - inset * 2, (cell - inset * 2) * 0.45, r);
        ctx.fill();
      }

      if (isHead) {
        // head shine
        ctx.fillStyle = "rgba(255,255,255,0.30)";
        roundRect(ctx, x + inset, y + inset, cell - inset * 2, (cell - inset * 2) * 0.4, r);
        ctx.fill();

        // eyes
        let dx1, dy1, dx2, dy2;
        const ex = cell * 0.24, ey = cell * 0.26;
        if (dir.x === 1)  { dx1 = cell - ex - cell*0.16; dy1 = ey;        dx2 = cell - ex - cell*0.16; dy2 = cell - ey - cell*0.10; }
        else if (dir.x === -1) { dx1 = cell*0.16; dy1 = ey;        dx2 = cell*0.16; dy2 = cell - ey - cell*0.10; }
        else if (dir.y === -1) { dx1 = ex;        dy1 = cell*0.16; dx2 = cell - ex - cell*0.10; dy2 = cell*0.16; }
        else                   { dx1 = ex;        dy1 = cell - ey - cell*0.10; dx2 = cell - ex - cell*0.10; dy2 = cell - ey - cell*0.10; }
        // sclera
        ctx.fillStyle = "#ffffff";
        const er = cell * 0.10;
        ctx.beginPath(); ctx.arc(x + dx1, y + dy1, er, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + dx2, y + dy2, er, 0, Math.PI * 2); ctx.fill();
        // pupil — looks toward the direction of travel
        ctx.fillStyle = "#1b2b1b";
        const pr = cell * 0.05;
        const pdx = dir.x * cell * 0.025;
        const pdy = dir.y * cell * 0.025;
        ctx.beginPath(); ctx.arc(x + dx1 + pdx, y + dy1 + pdy, pr, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + dx2 + pdx, y + dy2 + pdy, pr, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (deathFlash > 0) {
      ctx.fillStyle = `rgba(239,83,80,${0.32 * deathFlash})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  // Input
  function onKey(e) {
    const k = e.key;
    // Speed shortcuts work anywhere
    if (k === "1") { e.preventDefault(); setSpeed("slow");   return; }
    if (k === "2") { e.preventDefault(); setSpeed("normal"); return; }
    if (k === "3") { e.preventDefault(); setSpeed("fast");   return; }

    if (state === State.MENU || state === State.DEAD) {
      if (k === "r" || k === "R" || k === " " || k === "Enter" ||
          k.startsWith("Arrow") || /^[wasd]$/i.test(k)) {
        e.preventDefault();
        start();
        return;
      }
    }
    if (state === State.PAUSED) {
      if (k === " " || k === "Escape" || k === "p" || k === "P" || k === "Enter") {
        e.preventDefault();
        state = State.PLAYING;
        setOverlay("", false);
        return;
      }
    }
    if (state === State.PLAYING) {
      if (k === " " || k === "Escape" || k === "p" || k === "P") {
        e.preventDefault();
        showPaused();
        return;
      }
      if (k === "r" || k === "R") { e.preventDefault(); start(); return; }
      if (k === "ArrowUp"    || k === "w" || k === "W") { e.preventDefault(); tryQueueDir(0, -1); }
      if (k === "ArrowDown"  || k === "s" || k === "S") { e.preventDefault(); tryQueueDir(0,  1); }
      if (k === "ArrowLeft"  || k === "a" || k === "A") { e.preventDefault(); tryQueueDir(-1, 0); }
      if (k === "ArrowRight" || k === "d" || k === "D") { e.preventDefault(); tryQueueDir(1,  0); }
    }
  }
  window.addEventListener("keydown", onKey, { passive: false });

  pad.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    handleDirInput(btn.dataset.dir);
  });

  function handleDirInput(d) {
    if (d === "pause") {
      if (state === State.PLAYING) showPaused();
      else if (state === State.PAUSED) { state = State.PLAYING; setOverlay("", false); }
      else if (state === State.MENU || state === State.DEAD) start();
      return;
    }
    if (state === State.MENU || state === State.DEAD) { start(); }
    if (state !== State.PLAYING) return;
    if (d === "up")    tryQueueDir(0, -1);
    if (d === "down")  tryQueueDir(0,  1);
    if (d === "left")  tryQueueDir(-1, 0);
    if (d === "right") tryQueueDir(1,  0);
  }

  // Speed buttons inside the overlay (delegated)
  overlay.addEventListener("click", (e) => {
    const sb = e.target.closest("[data-speed]");
    if (sb) {
      e.stopPropagation();
      setSpeed(sb.dataset.speed);
      return;
    }
    if (state === State.MENU || state === State.DEAD) start();
    else if (state === State.PAUSED) { state = State.PLAYING; setOverlay("", false); }
  });

  // Touch / swipe on the canvas frame
  let touchStart = null;
  const SWIPE_MIN = 18;
  frame.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    // If the touch started on a speed button inside the overlay, let it through.
    if (e.target.closest && e.target.closest("[data-speed]")) return;
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY, time: performance.now(), moved: false };
  }, { passive: true });
  frame.addEventListener("touchmove", (e) => {
    if (!touchStart || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < SWIPE_MIN && ay < SWIPE_MIN) return;
    if (ax > ay) handleDirInput(dx > 0 ? "right" : "left");
    else         handleDirInput(dy > 0 ? "down"  : "up");
    touchStart.moved = true;
    touchStart.x = t.clientX;
    touchStart.y = t.clientY;
  }, { passive: true });
  frame.addEventListener("touchend", () => {
    if (!touchStart) return;
    const elapsed = performance.now() - touchStart.time;
    if (!touchStart.moved && elapsed < 350) {
      if (state === State.MENU || state === State.DEAD) start();
      else if (state === State.PLAYING) showPaused();
      else if (state === State.PAUSED) { state = State.PLAYING; setOverlay("", false); }
    }
    touchStart = null;
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === State.PLAYING) showPaused();
  });

  // Boot
  loadBest();
  loadSpeed();
  resize();
  reset();
  updateHud();
  showMenu();
  lastTick = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
